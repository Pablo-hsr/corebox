[colors]
; O segredo da transparência está nos dois primeiros dígitos (aa)
; #aaRRGGBB -> aa (00 é invisível, ff é sólido). 99 é um bom equilíbrio.
background = #99282a36
foreground = #f8f8f2
primary = #bd93f9

[bar/minhabarra]
width = 96%
height = 30
offset-x = 2%
offset-y = 10
radius = 12
fixed-center = true
bottom = false ; Isso garante que ela fique no TOPO

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3
padding-left = 2
padding-right = 2
module-margin = 2

font-0 = "sans-serif:size=10;2"
font-1 = "FontAwesome:size=11;3"

modules-left = i3
modules-center = date
modules-right = pulseaudio battery

[module/i3]
type = internal/i3
format = <label-state>
label-focused = %index%
label-focused-background = #44475a
label-focused-underline = ${colors.primary}
label-focused-padding = 2

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %d/%m/%Y %H:%M

label =  %date%

[module/pulseaudio]
type = internal/pulseaudio
format-volume =  <label-volume>
label-muted =  mudo

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
format-charging =  <label-charging>
format-discharging =  <label-discharging>